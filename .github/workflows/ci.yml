name: Build (manual only)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Manual run confirmation'
        required: false
        type: boolean
        default: false
jobs:
  build:
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
